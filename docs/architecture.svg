<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" class="diagram" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <style>
      .box { fill: #faf8ff; stroke: #6d28d9; stroke-width: 2; rx: 12; }
      .code { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .ai { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .ext { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
      .t { font-size: 14px; font-weight: 700; fill: #1c1530; }
      .s { font-size: 11.5px; fill: #4b5563; }
      .e { stroke: #6d28d9; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .lbl { font-size: 11px; fill: #6d28d9; font-weight: 600; }
    </style>
  </defs>

  <!-- browser -->
  <rect x="20" y="20" width="250" height="110" rx="12" class="box"/>
  <text x="36" y="46" class="t">Browser (React + three.js)</text>
  <text x="36" y="66" class="s">Avatar select · Equilibrium Hall</text>
  <text x="36" y="83" class="s">Door 1 rooms/cells · Door 3 King's Cross</text>
  <text x="36" y="100" class="s">Speech bubbles · matrix · slider · checks</text>
  <text x="36" y="117" class="s">(no API key in the browser)</text>

  <!-- api -->
  <rect x="330" y="20" width="230" height="110" rx="12" class="box"/>
  <text x="346" y="46" class="t">FastAPI (backend/main.py)</text>
  <text x="346" y="66" class="s">/api/session … /move /cell /dominant</text>
  <text x="346" y="83" class="s">/api/ultimatum … /offer /respond /answer</text>
  <text x="346" y="100" class="s">/api/quiz (graded in code)</text>
  <text x="346" y="117" class="s">Pydantic validation → 422 / 409 / 429</text>
  <path d="M270,75 L328,75" class="e"/>
  <text x="276" y="68" class="lbl">JSON</text>

  <!-- orchestrators + engines (code) -->
  <rect x="330" y="170" width="230" height="120" rx="12" class="code"/>
  <text x="346" y="196" class="t">Orchestrators (code)</text>
  <text x="346" y="216" class="s">turn order · which agent to call</text>
  <text x="346" y="233" class="s">fixed text (challenge question)</text>
  <text x="346" y="250" class="s">fallbacks if an agent fails</text>
  <text x="346" y="267" class="s">orchestrator.py · ultimatum_orchestrator.py</text>
  <path d="M445,130 L445,168" class="e"/>

  <rect x="20" y="170" width="250" height="120" rx="12" class="code"/>
  <text x="36" y="196" class="t">Game engines (code only)</text>
  <text x="36" y="216" class="s">payoffs, sentences, splits, scores</text>
  <text x="36" y="233" class="s">coverage controller (4 cells ≤ 4 rounds)</text>
  <text x="36" y="250" class="s">grading · budgets · phase checks</text>
  <text x="36" y="267" class="s">game/engine.py · game/ultimatum.py</text>
  <path d="M330,230 L272,230" class="e"/>
  <text x="280" y="222" class="lbl">rules</text>

  <!-- run_agent -->
  <rect x="620" y="170" width="220" height="120" rx="12" class="box"/>
  <text x="636" y="196" class="t">run_agent() guard</text>
  <text x="636" y="216" class="s">session cap: 50 AI calls</text>
  <text x="636" y="233" class="s">per call: 5 requests / 12K tokens</text>
  <text x="636" y="250" class="s">logs tokens → token_log.jsonl</text>
  <text x="636" y="267" class="s">logs outputs → audit_trail.jsonl</text>
  <path d="M560,230 L618,230" class="e"/>

  <!-- agents -->
  <rect x="20" y="330" width="190" height="120" rx="12" class="ai"/>
  <text x="34" y="355" class="t">Detective Zhou</text>
  <text x="34" y="375" class="s">cop · CopLine</text>
  <text x="34" y="392" class="s">tools: case file, history</text>
  <text x="34" y="409" class="s">story, twists, verdicts</text>

  <rect x="225" y="330" width="200" height="120" rx="12" class="ai"/>
  <text x="239" y="355" class="t">Tung Tung Tung Sahur</text>
  <text x="239" y="375" class="s">partner · PartnerDecision</text>
  <text x="239" y="392" class="s">responder · proposer (Door 3)</text>
  <text x="239" y="409" class="s">output validators + retry</text>
  <text x="239" y="426" class="s">engine override if still invalid</text>

  <rect x="440" y="330" width="190" height="120" rx="12" class="ai"/>
  <text x="454" y="355" class="t">Nash-sensei</text>
  <text x="454" y="375" class="s">tutor / host · TutorReply</text>
  <text x="454" y="392" class="s">tools: matrix progress</text>
  <text x="454" y="409" class="s">hints, challenges, debriefs</text>

  <rect x="660" y="330" width="180" height="120" rx="12" class="ext"/>
  <text x="674" y="355" class="t">Portkey gateway</text>
  <text x="674" y="375" class="s">provider: openai</text>
  <text x="674" y="392" class="s">model: gpt-6-luna</text>
  <text x="674" y="409" class="s">reasoning_effort: none</text>
  <text x="674" y="426" class="s">provider content filter</text>

  <path d="M680,290 L115,328" class="e"/>
  <path d="M700,290 L325,328" class="e"/>
  <path d="M720,290 L535,328" class="e"/>
  <path d="M630,390 L658,390" class="e"/>
  <text x="560" y="312" class="lbl">typed, validated outputs</text>
</svg>
